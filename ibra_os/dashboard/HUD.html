<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ibra-OS HUD - Mobile Garage Dashboard</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0a">
    <style>
        body {
            background-color: #0a0a0a;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            width: 100%;
            max-width: 1200px;
        }
        .panel {
            border: 1px solid #00ff41;
            padding: 15px;
            background: rgba(0, 255, 65, 0.05);
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.2);
            border-radius: 8px;
        }
        h1, h2 {
            text-transform: uppercase;
            text-align: center;
            border-bottom: 1px solid #00ff41;
            padding-bottom: 10px;
            font-size: 1.2em;
        }
        .status-online { color: #00ff41; }
        .status-busy { color: #ffcc00; }
        .pulse {
            animation: pulse-animation 2s infinite;
        }
        @keyframes pulse-animation {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .header-tools {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 15px;
        }
        .lang-switch button, .mobile-actions button {
            background: #00ff41;
            color: #000;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            font-weight: bold;
            margin-left: 5px;
            border-radius: 4px;
            font-size: 0.9em;
        }
        .mobile-actions {
            margin-top: 10px;
            display: flex;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }
        .action-btn {
            flex: 1;
            max-width: 150px;
        }
        @media (max-width: 600px) {
            body { padding: 5px; }
            h1 { font-size: 1em; }
            .container { grid-template-columns: 1fr; }
            .panel { padding: 10px; }
        }
    </style>
</head>
<body>
    <div class="header-tools">
        <div class="mobile-actions">
            <button class="action-btn" id="btn-camera">📸 CAMERA</button>
            <button class="action-btn" id="btn-mic">🎤 VOCAL</button>
        </div>
        <div class="lang-switch">
            <button onclick="setLang('fr')">FR</button>
            <button onclick="setLang('en')">EN</button>
        </div>
    </div>

    <h1 id="title">IBRA SERVICES INC. - Brain IA HUD</h1>

    <div style="text-align: center; margin-bottom: 20px;">
        <span id="active-mode" style="background: #00ff41; color: #000; padding: 5px 15px; font-weight: bold; border-radius: 5px;">MODE: HERMES (Standard)</span>
    </div>

    <div class="container">
        <div class="panel">
            <h2 id="h-agents">Statut des Agents</h2>
            <ul>
                <li>Secretary: <span class="status-online pulse">ONLINE</span></li>
                <li>Vision: <span class="status-online">READY</span></li>
                <li>Physics: <span class="status-online">ACTIVE</span></li>
            </ul>
        </div>
        <div class="panel">
            <h2 id="h-appoint">Rendez-vous</h2>
            <div id="appointments">
                <p>Aucun rendez-vous actif.</p>
            </div>
        </div>
        <div class="panel">
            <h2 id="h-stock">Stocks</h2>
            <ul>
                <li>Filters: 25</li>
                <li>Brakes: 12 sets</li>
            </ul>
        </div>
        <div class="panel">
            <h2 id="h-logs">Logs</h2>
            <div id="logs-container" style="font-size: 0.8em; height: 80px; overflow-y: scroll;">
                [SYSTEM] Mobile Interface Loaded.
            </div>
        </div>
    </div>

    <script>
        const translations = {
            fr: {
                title: "IBRA SERVICES INC. - Brain IA HUD",
                agents: "Statut des Agents",
                appoint: "Rendez-vous",
                stock: "Stocks & Pièces",
                logs: "Logs Système"
            },
            en: {
                title: "IBRA SERVICES INC. - Mobile HUD",
                agents: "Agent Status",
                appoint: "Appointments",
                stock: "Stock & Parts",
                logs: "System Logs"
            }
        };

        let currentLang = 'fr';
        function setLang(lang) {
            currentLang = lang;
            document.getElementById('title').innerText = translations[lang].title;
            document.getElementById('h-agents').innerText = translations[lang].agents;
            document.getElementById('h-appoint').innerText = translations[lang].appoint;
            document.getElementById('h-stock').innerText = translations[lang].stock;
            document.getElementById('h-logs').innerText = translations[lang].logs;
            updateModeDisplay();
        }

        function updateModeDisplay() {
            const modeSpan = document.getElementById('active-mode');
            const isClaw = modeSpan.innerText.includes('CLAW');
            if (currentLang === 'fr') {
                modeSpan.innerText = isClaw ? "MODE: CLAW (Autonome)" : "MODE: HERMES (Standard)";
            } else {
                modeSpan.innerText = isClaw ? "MODE: CLAW (Autonomous)" : "MODE: HERMES (Standard)";
            }
        }

        // Simuler un changement de mode pour la démo
        setInterval(() => {
            const modeSpan = document.getElementById('active-mode');
            if (modeSpan.innerText.includes('HERMES')) {
                modeSpan.innerText = currentLang === 'fr' ? "MODE: CLAW (Autonome)" : "MODE: CLAW (Autonomous)";
                modeSpan.style.background = "#ff00ff"; // Pink for Claw
            } else {
                modeSpan.innerText = currentLang === 'fr' ? "MODE: HERMES (Standard)" : "MODE: HERMES (Standard)";
                modeSpan.style.background = "#00ff41"; // Green for Hermes
            }
        }, 5000);

        // Mobile Action Listeners
        document.getElementById('btn-camera').addEventListener('click', () => {
            const log = document.getElementById('logs-container');
            log.innerHTML += `[${new Date().toLocaleTimeString()}] Vision: Camera requested...<br>`;
            log.scrollTop = log.scrollHeight;
            alert("Caméra activée (Simulation Vision Agent)");
        });

        document.getElementById('btn-mic').addEventListener('click', () => {
            const log = document.getElementById('logs-container');
            log.innerHTML += `[${new Date().toLocaleTimeString()}] Secretary: Listening...<br>`;
            log.scrollTop = log.scrollHeight;
            alert("Microphone activé (Simulation Voice Agent)");
        });

        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(reg => {
                    console.log('SW registered!', reg);
                }).catch(err => {
                    console.log('SW registration failed!', err);
                });
            });
        }
    </script>
</body>
</html>
